<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sublight Idle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/break_infinity.js@2.0.0/dist/break_infinity.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .glow { text-shadow: 0 0 12px rgba(125, 211, 252, 0.6); }
    #gather:active { transform: scale(0.97); }
  </style>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen">
  <main class="max-w-3xl mx-auto px-4 py-8 space-y-8">
    <header class="flex items-baseline justify-between">
      <h1 class="text-sm tracking-[0.3em] uppercase text-slate-500">Sublight</h1>
      <div class="flex gap-3 text-xs text-slate-500">
        <button id="save-btn" class="hover:text-sky-300">save</button>
        <button id="export-btn" class="hover:text-sky-300">export</button>
        <button id="import-btn" class="hover:text-sky-300">import</button>
        <button id="reset-btn" class="hover:text-rose-400">reset</button>
      </div>
    </header>

    <section class="text-center space-y-2">
      <div class="text-xs uppercase tracking-widest text-slate-500">Photons</div>
      <div id="photons" class="text-5xl text-sky-200 glow tabular-nums">0</div>
      <div class="text-sm text-slate-500"><span id="pps" class="tabular-nums">0</span> / sec</div>
      <button id="gather" class="mt-4 px-6 py-3 border border-sky-800 rounded-md text-sky-200 hover:bg-sky-950 hover:border-sky-500 transition">
        Gather photons
      </button>
    </section>

    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs uppercase tracking-widest text-slate-500">Arrays</h2>
        <div class="flex gap-1 text-xs" id="buy-mode">
          <button data-mode="1" class="px-2 py-1 rounded border border-slate-700">x1</button>
          <button data-mode="10" class="px-2 py-1 rounded border border-slate-700">x10</button>
          <button data-mode="max" class="px-2 py-1 rounded border border-slate-700">max</button>
        </div>
      </div>
      <div id="generators" class="space-y-2"></div>
      <p class="text-xs text-slate-600">Every 25 of an array doubles its output.</p>
    </section>

    <section class="text-xs text-slate-500 grid grid-cols-2 gap-2 border-t border-slate-800 pt-4">
      <div>Total photons: <span id="stat-total" class="text-slate-300">0</span></div>
      <div>Time played: <span id="stat-time" class="text-slate-300">0s</span></div>
    </section>

    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded bg-slate-800 text-sm text-slate-200 opacity-0 transition-opacity pointer-events-none"></div>
  </main>

  <script src="src/game.js"></script>
</body>
</html>
